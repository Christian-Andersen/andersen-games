on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            just \
            nodejs \
            npm
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
      - name: Install prek
        run: env UV_TOOL_BIN_DIR=/usr/local/bin uv tool install prek
      - name: Run CI
        run: just ci
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    needs: ci
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            nodejs \
            npm
      - name: Checkout
        uses: actions/checkout@v7
      # build-pipeline.js resolves ./games and ./dist/games relative to the
      # working directory, so the build has to run from inside frontend/.
      - name: Install dependencies and build
        run: |
          cd frontend
          npm ci
          node build-pipeline.js
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages deploy frontend/dist --project-name=${{ github.event.repository.name }}
