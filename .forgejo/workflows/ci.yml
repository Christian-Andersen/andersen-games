on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      # Install just from the distro package archive. setup-just authenticated
      # its release lookup with Forgejo's GITHUB_TOKEN and failed with "Bad
      # credentials"; apt avoids the GitHub API entirely.
      - name: Set up Just
        run: |
          apt-get update
          apt-get install -y --no-install-recommends just
      - name: Install prek
        run: uv tool install prek
      - name: Run CI
        run: just ci
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # build-pipeline.js resolves ./games and ./dist/games relative to the
      # working directory, so the build has to run from inside frontend/.
      - name: Install dependencies and build
        run: |
          cd frontend
          npm ci
          node build-pipeline.js
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages deploy frontend/dist --project-name=${{ github.event.repository.name }}
