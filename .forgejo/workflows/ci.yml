on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@v23
      - name: Run CI
        run: nix develop --command just ci
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@v23
      # build-pipeline.js resolves ./games and ./dist/games relative to the
      # working directory, so the build has to run from inside frontend/.
      - name: Install dependencies and build
        run: |
          nix develop --command bash -c 'cd frontend && npm ci && node build-pipeline.js'
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          nix develop --command npx wrangler pages deploy frontend/dist --project-name=${{ github.event.repository.name }}
