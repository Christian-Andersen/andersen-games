[[repos]]
repo = "local"

[[repos.hooks]]
id = "biome-check"
name = "biome-check"
language = "system"
pass_filenames = false
entry = "npm exec biome check --write src/"

[[repos.hooks]]
id = "vue-tsc"
name = "vue-tsc"
language = "system"
pass_filenames = false
entry = "npm run check"

[[repos.hooks]]
id = "audit"
name = "audit"
language = "system"
pass_filenames = false
stages = ["manual"]
entry = "npm audit"
